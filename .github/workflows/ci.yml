name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    if: github.repository == 'kalink0/homebrew-forensics'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tap local repository
        run: brew tap --custom-remote kalink0/forensics "$GITHUB_WORKSPACE"
      - name: Audit casks
        run: brew audit --cask --tap kalink0/forensics
      - name: Check style
        run: brew style kalink0/forensics
      - name: Check upstream versions
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: brew livecheck --tap kalink0/forensics

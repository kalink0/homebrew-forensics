name: Autobump

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  autobump:
    if: github.repository == 'kalink0/homebrew-forensics'
    runs-on: macos-latest
    steps:
      - name: Tap repository
        run: brew tap kalink0/forensics
      - name: Trust tap
        run: brew trust kalink0/forensics
      - name: Open bump pull requests
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_BUMP_TOKEN }}
        run: brew bump --tap kalink0/forensics --open-pr --no-fork
      - name: Enable auto-merge on bump pull requests
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_BUMP_TOKEN }}
        run: |
          gh pr list --repo kalink0/homebrew-forensics --state open \
            --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("bump-")) | .number' |
          while read -r pr; do
            gh pr merge "$pr" --repo kalink0/homebrew-forensics --auto --squash
          done
